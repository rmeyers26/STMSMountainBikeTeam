[build]
  publish = "."

[functions]
  directory = "functions"
  node_bundler = "esbuild"

# ---------------------------------------------------------------------------
# Form notification emails
# NOTE: Registration, volunteer, and sponsor inquiry forms use Netlify Forms notifications.
# Apparel orders are submitted to Supabase through /.netlify/functions/submit-apparel.
# After deploying, go to Netlify Dashboard → Site settings → Forms →
# Form notifications → Add notification → Email notification
# and add coach@stingersmtb.com for each Netlify-managed form.
# ---------------------------------------------------------------------------

# Redirect all form submissions to the same page (no separate success page needed)
[[redirects]]
  from = "/?submitted=true"
  to = "/"
  status = 200

# ---------------------------------------------------------------------------
# Security headers
# The site is static HTML with inline <script>/<style> blocks and no build
# step to generate nonces/hashes, so script-src/style-src allow
# 'unsafe-inline'. Everything else is locked to same-origin, plus the
# YouTube embed on quickstart.html.
# ---------------------------------------------------------------------------
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Content-Security-Policy = """\
      default-src 'self'; \
      script-src 'self' 'unsafe-inline'; \
      style-src 'self' 'unsafe-inline'; \
      img-src 'self' data:; \
      font-src 'self' data:; \
      connect-src 'self'; \
      frame-src https://www.youtube.com; \
      object-src 'none'; \
      base-uri 'self'; \
      form-action 'self'; \
      frame-ancestors 'none'\
      """
